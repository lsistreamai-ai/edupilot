<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EduPilot - Learning Platform</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: linear-gradient(180deg, #eff6ff 0%, #ffffff 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .container { width: 100%; max-width: 420px; }
    .header { display: flex; justify-content: flex-end; margin-bottom: 20px; }
    .lang-toggle { display: flex; background: white; border-radius: 10px; overflow: hidden; box-shadow: 0 2px 8px rgba(0,0,0,0.08); }
    .lang-btn { padding: 6px 14px; background: none; border: none; color: #64748b; font-size: 12px; font-weight: 700; cursor: pointer; }
    .lang-btn.active { background: linear-gradient(135deg, #3b82f6, #1d4ed8); color: white; }
    .logo { text-align: center; margin-bottom: 28px; }
    .logo-icon { font-size: 64px; margin-bottom: 12px; }
    .logo-text { font-size: 28px; font-weight: 900; background: linear-gradient(135deg, #1e3a5f, #3b82f6); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
    .logo-tagline { font-size: 13px; color: #94a3b8; margin-top: 6px; }
    .card { background: white; border-radius: 20px; padding: 28px 24px; box-shadow: 0 4px 24px rgba(0,0,0,0.06); }
    .tab-switcher { display: flex; background: #f8fafc; border-radius: 12px; padding: 4px; margin-bottom: 24px; }
    .tab-btn { flex: 1; padding: 12px; border: none; background: none; border-radius: 10px; font-size: 14px; font-weight: 600; color: #64748b; cursor: pointer; }
    .tab-btn.active { background: white; color: #3b82f6; box-shadow: 0 2px 8px rgba(0,0,0,0.08); font-weight: 700; }
    .form-title { font-size: 22px; font-weight: 800; color: #1e293b; margin-bottom: 24px; text-align: center; }
    .form-group { margin-bottom: 18px; }
    .form-label { display: block; font-size: 13px; font-weight: 600; color: #475569; margin-bottom: 8px; }
    .form-input { width: 100%; padding: 14px 16px; border: 2px solid #e2e8f0; border-radius: 12px; font-size: 15px; background: #f8fafc; }
    .form-input:focus { outline: none; border-color: #3b82f6; background: white; }
    .role-select { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; }
    .role-option { padding: 16px; border: 2px solid #e2e8f0; border-radius: 12px; text-align: center; cursor: pointer; background: #f8fafc; }
    .role-option.selected { border-color: #3b82f6; background: #eff6ff; }
    .role-icon { font-size: 32px; margin-bottom: 6px; }
    .role-label { font-size: 14px; font-weight: 600; color: #1e293b; }
    .submit-btn { width: 100%; padding: 16px; background: linear-gradient(135deg, #3b82f6, #1d4ed8); color: white; border: none; border-radius: 12px; font-size: 16px; font-weight: 700; cursor: pointer; margin-top: 8px; }
    .submit-btn:hover { transform: translateY(-1px); box-shadow: 0 4px 12px rgba(59, 130, 246, 0.4); }
    .forgot-link { text-align: center; margin-top: 18px; }
    .forgot-link a { color: #3b82f6; font-size: 13px; font-weight: 600; text-decoration: none; }
    .error { background: #fee2e2; color: #dc2626; padding: 12px; border-radius: 10px; font-size: 14px; margin-bottom: 16px; display: none; }
    .success { background: #dcfce7; color: #16a34a; padding: 12px; border-radius: 10px; font-size: 14px; margin-bottom: 16px; display: none; }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <div class="lang-toggle">
        <button class="lang-btn active" onclick="setLang('en')">EN</button>
        <button class="lang-btn" onclick="setLang('zh')">中文</button>
      </div>
    </div>

    <div class="logo">
      <div class="logo-icon">🎓</div>
      <div class="logo-text">EduPilot</div>
      <div class="logo-tagline" data-en="Learn • Play • Grow" data-zh="學習 • 遊戲 • 成長">Learn • Play • Grow</div>
    </div>

    <div class="card">
      <div class="tab-switcher">
        <button class="tab-btn active" onclick="showLogin()">Login</button>
        <button class="tab-btn" onclick="showSignup()">Sign Up</button>
      </div>

      <div id="loginForm">
        <div class="form-title" data-en="Welcome Back!" data-zh="歡迎回來!">Welcome Back!</div>
        <div class="error" id="loginError"></div>
        <div class="success" id="loginSuccess"></div>
        <div class="form-group">
          <label class="form-label" data-en="Email" data-zh="電郵">Email</label>
          <input type="email" class="form-input" id="loginEmail" placeholder="your@email.com" required>
        </div>
        <div class="form-group">
          <label class="form-label" data-en="Password" data-zh="密碼">Password</label>
          <input type="password" class="form-input" id="loginPassword" placeholder="••••••••" required>
        </div>
        <button class="submit-btn" onclick="doLogin(event)" id="loginBtn" data-en="Login" data-zh="登入">Login</button>
        <div class="forgot-link">
          <a href="#" data-en="Forgot password?" data-zh="忘記密碼?">Forgot password?</a>
        </div>
      </div>

      <div id="signupForm" style="display: none;">
        <div class="form-title" data-en="Create Account" data-zh="建立帳戶">Create Account</div>
        <div class="error" id="signupError"></div>
        <div class="success" id="signupSuccess"></div>
        <div class="form-group">
          <label class="form-label" data-en="Full Name" data-zh="姓名">Full Name</label>
          <input type="text" class="form-input" id="signupName" placeholder="Tommy Tsang" required>
        </div>
        <div class="form-group">
          <label class="form-label" data-en="Email" data-zh="電郵">Email</label>
          <input type="email" class="form-input" id="signupEmail" placeholder="your@email.com" required>
        </div>
        <div class="form-group">
          <label class="form-label" data-en="Password" data-zh="密碼">Password</label>
          <input type="password" class="form-input" id="signupPassword" placeholder="••••••••" required minlength="6">
        </div>
        <div class="form-group">
          <label class="form-label" data-en="I am a..." data-zh="我是...">I am a...</label>
          <div class="role-select">
            <div class="role-option" id="studentRole" onclick="selectRole('student')">
              <div class="role-icon">👦</div>
              <div class="role-label" data-en="Student" data-zh="學生">Student</div>
            </div>
            <div class="role-option" id="teacherRole" onclick="selectRole('teacher')">
              <div class="role-icon">👨‍🏫</div>
              <div class="role-label" data-en="Teacher" data-zh="老師">Teacher</div>
            </div>
          </div>
        </div>
        <button class="submit-btn" onclick="doSignup(event)" id="signupBtn" data-en="Create Account" data-zh="建立帳戶">Create Account</button>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    var supabase;
    var currentLang = 'en';
    var selectedRole = '';

    // Initialize on page load
    window.onload = function() {
      console.log('Page loaded, initializing Supabase...');
      
      supabase = window.supabase.createClient(
        'https://zpyglubdgpecdfsrnirz.supabase.co',
        'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InpweWdsdWJkZ3BlY2Rmc3JuaXJ6Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzg3NTYxNTksImV4cCI6MjA5NDMzMjE1OX0.IEBm33tSXSS7p1ivjXGNowAbyk7uYQTBCSrZJZ68maU'
      );
      
      console.log('Supabase initialized');
      
      // Check saved language
      var saved = localStorage.getItem('lang');
      if (saved === 'zh') setLang('zh');
      
      // Check if already logged in
      checkSession();
    };

    function setLang(lang) {
      currentLang = lang;
      var btns = document.querySelectorAll('.lang-btn');
      btns.forEach(function(b, i) {
        if (i === 0 && lang === 'en') b.classList.add('active');
        else if (i === 1 && lang === 'zh') b.classList.add('active');
        else b.classList.remove('active');
      });
      
      var elements = document.querySelectorAll('[data-en]');
      elements.forEach(function(el) {
        el.textContent = el.getAttribute('data-' + lang);
      });
      
      localStorage.setItem('lang', lang);
    }

    function showLogin() {
      document.getElementById('loginForm').style.display = 'block';
      document.getElementById('signupForm').style.display = 'none';
      var btns = document.querySelectorAll('.tab-btn');
      btns[0].classList.add('active');
      btns[1].classList.remove('active');
      hideErrors();
    }

    function showSignup() {
      document.getElementById('loginForm').style.display = 'none';
      document.getElementById('signupForm').style.display = 'block';
      var btns = document.querySelectorAll('.tab-btn');
      btns[0].classList.remove('active');
      btns[1].classList.add('active');
      hideErrors();
    }

    function selectRole(role) {
      selectedRole = role;
      document.getElementById('studentRole').classList.remove('selected');
      document.getElementById('teacherRole').classList.remove('selected');
      document.getElementById(role + 'Role').classList.add('selected');
    }

    function showError(el, msg) {
      document.getElementById(el).textContent = msg;
      document.getElementById(el).style.display = 'block';
    }

    function showSuccess(el, msg) {
      document.getElementById(el).textContent = msg;
      document.getElementById(el).style.display = 'block';
    }

    function hideErrors() {
      document.getElementById('loginError').style.display = 'none';
      document.getElementById('signupError').style.display = 'none';
      document.getElementById('loginSuccess').style.display = 'none';
      document.getElementById('signupSuccess').style.display = 'none';
    }

    async function doLogin(e) {
      e.preventDefault();
      hideErrors();
      
      var email = document.getElementById('loginEmail').value;
      var password = document.getElementById('loginPassword').value;
      var btn = document.getElementById('loginBtn');
      
      if (!email || !password) {
        showError('loginError', currentLang === 'zh' ? '請填寫所有欄位' : 'Please fill all fields');
        return;
      }
      
      btn.disabled = true;
      btn.textContent = currentLang === 'zh' ? '登入中...' : 'Logging in...';
      
      try {
        console.log('Attempting login...');
        var result = await supabase.auth.signInWithPassword({ email: email, password: password });
        
        if (result.error) {
          console.error('Login error:', result.error);
          showError('loginError', result.error.message);
          btn.disabled = false;
          btn.textContent = currentLang === 'zh' ? '登入' : 'Login';
          return;
        }
        
        console.log('Login successful, checking role...');
        showSuccess('loginSuccess', currentLang === 'zh' ? '登入成功!' : 'Login successful!');
        
        // Get role
        var userResult = await supabase.from('users').select('role').eq('id', result.data.user.id).single();
        
        console.log('User role:', userResult.data);
        
        if (userResult.data && userResult.data.role === 'teacher') {
          window.location.href = 'teacher-dashboard.html';
        } else {
          window.location.href = 'student-dashboard-full.html';
        }
        
      } catch (err) {
        console.error('Exception:', err);
        showError('loginError', err.message);
        btn.disabled = false;
        btn.textContent = currentLang === 'zh' ? '登入' : 'Login';
      }
    }

    async function doSignup(e) {
      e.preventDefault();
      hideErrors();
      
      var name = document.getElementById('signupName').value;
      var email = document.getElementById('signupEmail').value;
      var password = document.getElementById('signupPassword').value;
      var btn = document.getElementById('signupBtn');
      
      if (!name || !email || !password) {
        showError('signupError', currentLang === 'zh' ? '請填寫所有欄位' : 'Please fill all fields');
        return;
      }
      
      if (!selectedRole) {
        showError('signupError', currentLang === 'zh' ? '請選擇學生或老師' : 'Please select Student or Teacher');
        return;
      }
      
      btn.disabled = true;
      btn.textContent = currentLang === 'zh' ? '建立中...' : 'Creating...';
      
      try {
        console.log('Attempting signup...');
        var result = await supabase.auth.signUp({
          email: email,
          password: password,
          options: {
            data: { name: name, role: selectedRole }
          }
        });
        
        if (result.error) {
          console.error('Signup error:', result.error);
          showError('signupError', result.error.message);
          btn.disabled = false;
          btn.textContent = currentLang === 'zh' ? '建立帳戶' : 'Create Account';
          return;
        }
        
        console.log('Signup successful, creating user record...');
        
        // Create user record
        if (result.data.user) {
          await supabase.from('users').insert({
            id: result.data.user.id,
            email: email,
            name: name,
            role: selectedRole,
            points: 0,
            level: 1
          });
        }
        
        showSuccess('signupSuccess', currentLang === 'zh' ? '帳戶建立成功!請查收確認郵件。' : 'Account created! Check your email.');
        btn.disabled = false;
        btn.textContent = currentLang === 'zh' ? '建立帳戶' : 'Create Account';
        
        setTimeout(showLogin, 2000);
        
      } catch (err) {
        console.error('Exception:', err);
        showError('signupError', err.message);
        btn.disabled = false;
        btn.textContent = currentLang === 'zh' ? '建立帳戶' : 'Create Account';
      }
    }

    async function checkSession() {
      try {
        var sess = await supabase.auth.getSession();
        if (sess.data.session) {
          var userResult = await supabase.from('users').select('role').eq('id', sess.data.session.user.id).single();
          if (userResult.data) {
            window.location.href = userResult.data.role === 'teacher' ? 'teacher-dashboard.html' : 'student-dashboard-full.html';
          }
        }
      } catch (err) {
        console.log('No active session');
      }
    }
  </script>
</body>
</html>
