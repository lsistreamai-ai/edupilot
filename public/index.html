<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>EduPilot - Login</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
      background: linear-gradient(135deg, #e0f2fe 0%, #ede9fe 50%, #fce7f3 100%);
      -webkit-font-smoothing: antialiased;
    }

    /* Floating blobs */
    .blob {
      position: fixed;
      border-radius: 50%;
      filter: blur(60px);
      opacity: 0.6;
      animation: blob 7s infinite;
      pointer-events: none;
    }
    .blob-1 { top: -100px; right: -100px; width: 300px; height: 300px; background: #93c5fd; }
    .blob-2 { bottom: -100px; left: -100px; width: 300px; height: 300px; background: #c4b5fd; animation-delay: 2s; }
    .blob-3 { top: 50%; left: 50%; transform: translate(-50%, -50%); width: 300px; height: 300px; background: #fbcfe8; animation-delay: 4s; }

    @keyframes blob {
      0%, 100% { transform: translate(0, 0) scale(1); }
      33% { transform: translate(30px, -50px) scale(1.1); }
      66% { transform: translate(-20px, 20px) scale(0.9); }
    }

    /* Main container */
    .container {
      position: relative;
      width: 100%;
      max-width: 420px;
    }

    /* Logo */
    .logo {
      text-align: center;
      margin-bottom: 24px;
    }

    .logo-icon {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 80px;
      height: 80px;
      background: linear-gradient(135deg, #3b82f6, #8b5cf6);
      border-radius: 24px;
      box-shadow: 0 20px 40px rgba(59, 130, 246, 0.3);
      margin-bottom: 16px;
    }

    .logo-icon span {
      font-size: 48px;
    }

    .logo h1 {
      font-size: 32px;
      font-weight: 700;
      color: #1f2937;
    }

    .logo p {
      color: #6b7280;
      margin-top: 4px;
    }

    /* Card */
    .card {
      background: rgba(255, 255, 255, 0.9);
      backdrop-filter: blur(20px);
      border-radius: 24px;
      box-shadow: 0 25px 50px rgba(59, 130, 246, 0.15);
      overflow: hidden;
    }

    /* Role toggle */
    .role-toggle {
      display: flex;
      border-bottom: 1px solid #f3f4f6;
    }

    .role-btn {
      flex: 1;
      padding: 16px;
      font-size: 14px;
      font-weight: 500;
      background: none;
      border: none;
      cursor: pointer;
      transition: all 0.2s;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    .role-btn.student {
      color: #6b7280;
    }

    .role-btn.teacher {
      color: #6b7280;
    }

    .role-btn.student.active {
      color: #2563eb;
      background: rgba(239, 246, 255, 0.5);
      border-bottom: 2px solid #2563eb;
    }

    .role-btn.teacher.active {
      color: #7c3aed;
      background: rgba(245, 243, 255, 0.5);
      border-bottom: 2px solid #7c3aed;
    }

    /* Form */
    .form {
      padding: 24px;
    }

    .toggle-text {
      text-align: center;
      font-size: 14px;
      color: #6b7280;
      margin-bottom: 20px;
    }

    .toggle-text a {
      font-weight: 600;
      text-decoration: none;
    }

    .toggle-text a.student { color: #2563eb; }
    .toggle-text a.teacher { color: #7c3aed; }

    .field {
      margin-bottom: 16px;
    }

    .field label {
      display: block;
      font-size: 14px;
      font-weight: 500;
      color: #374151;
      margin-bottom: 6px;
    }

    .field input,
    .field select {
      width: 100%;
      padding: 12px 16px;
      font-size: 16px;
      border: 1px solid #e5e7eb;
      border-radius: 12px;
      outline: none;
      transition: all 0.2s;
      background: white;
    }

    .field input:focus,
    .field select:focus {
      border-color: #3b82f6;
      box-shadow: 0 0 0 4px rgba(59, 130, 246, 0.1);
    }

    .field.teacher input:focus,
    .field.teacher select:focus {
      border-color: #7c3aed;
      box-shadow: 0 0 0 4px rgba(124, 58, 237, 0.1);
    }

    .field select {
      cursor: pointer;
    }

    .message {
      padding: 12px;
      border-radius: 12px;
      font-size: 14px;
      margin-bottom: 16px;
    }

    .message.success {
      background: #ecfdf5;
      color: #059669;
      border: 1px solid #86efac;
    }

    .message.error {
      background: #fef2f2;
      color: #dc2626;
      border: 1px solid #fca5a5;
    }

    .submit-btn {
      width: 100%;
      padding: 14px;
      font-size: 16px;
      font-weight: 700;
      color: white;
      border: none;
      border-radius: 12px;
      cursor: pointer;
      transition: all 0.2s;
      transform: translateY(0);
    }

    .submit-btn.student {
      background: linear-gradient(135deg, #3b82f6, #2563eb);
      box-shadow: 0 10px 20px rgba(59, 130, 246, 0.3);
    }

    .submit-btn.teacher {
      background: linear-gradient(135deg, #8b5cf6, #7c3aed);
      box-shadow: 0 10px 20px rgba(139, 92, 246, 0.3);
    }

    .submit-btn:hover {
      transform: translateY(-2px);
    }

    .submit-btn:active {
      transform: translateY(0);
    }

    .footer-text {
      text-align: center;
      font-size: 12px;
      color: #9ca3af;
      margin-top: 16px;
    }

    .hidden { display: none; }
  </style>
</head>
<body>
  <div class="blob blob-1"></div>
  <div class="blob blob-2"></div>
  <div class="blob blob-3"></div>

  <div class="container">
    <div class="logo">
      <div class="logo-icon"><span>✈️</span></div>
      <h1>EduPilot</h1>
      <p>Pilot your education journey</p>
    </div>

    <div class="card">
      <div class="role-toggle">
        <button class="role-btn student active" onclick="setRole('student')">
          <span>👨‍🎓</span> Student
        </button>
        <button class="role-btn teacher" onclick="setRole('teacher')">
          <span>👨‍🏫</span> Teacher
        </button>
      </div>

      <form class="form" onsubmit="handleSubmit(event)">
        <p class="toggle-text">
          <span id="toggle-label">Don't have an account?</span>
          <a href="#" id="toggle-link" class="student" onclick="toggleLogin(event)">Sign up</a>
        </p>

        <div class="field hidden" id="name-field">
          <label>Name</label>
          <input type="text" id="name" placeholder="Your name">
        </div>

        <div class="field">
          <label>Email</label>
          <input type="email" id="email" required placeholder="you@example.com">
        </div>

        <div class="field">
          <label>Password</label>
          <input type="password" id="password" required placeholder="••••••••">
        </div>

        <div class="field hidden" id="grade-field">
          <label>Grade</label>
          <select id="grade">
            <option value="">Select your grade</option>
            <optgroup label="Primary (TSA)">
              <option value="Primary 1">Primary 1</option>
              <option value="Primary 2">Primary 2</option>
              <option value="Primary 3">Primary 3</option>
              <option value="Primary 4">Primary 4</option>
              <option value="Primary 5">Primary 5</option>
              <option value="Primary 6">Primary 6</option>
            </optgroup>
            <optgroup label="Secondary (DSE)">
              <option value="Secondary 1">Secondary 1</option>
              <option value="Secondary 2">Secondary 2</option>
              <option value="Secondary 3">Secondary 3</option>
              <option value="Secondary 4">Secondary 4</option>
              <option value="Secondary 5">Secondary 5</option>
              <option value="Secondary 6">Secondary 6</option>
            </optgroup>
          </select>
        </div>

        <div class="field hidden" id="subject-field">
          <label>Main Subject</label>
          <select id="subject">
            <option value="">Select your subject</option>
            <optgroup label="Primary (TSA)">
              <option value="CHIN-P">Chinese 中文</option>
              <option value="ENG-P">English 英文</option>
              <option value="MATH-P">Math 數學</option>
              <option value="GS-P">General Studies 常識</option>
            </optgroup>
            <optgroup label="Secondary (DSE)">
              <option value="CHIN-S">Chinese 中國語文</option>
              <option value="ENG-S">English 英國語文</option>
              <option value="MATH-S">Math 數學</option>
              <option value="PHY-S">Physics 物理</option>
              <option value="CHEM-S">Chemistry 化學</option>
              <option value="BIO-S">Biology 生物</option>
              <option value="ECON-S">Economics 經濟</option>
              <option value="ICT-S">ICT 資訊科技</option>
            </optgroup>
          </select>
        </div>

        <button type="submit" class="submit-btn student" id="submit-btn">Sign In</button>
      </form>
    </div>

    <p class="footer-text">TSA (Primary) & DSE (Secondary) • Hong Kong</p>
  </div>

  <script>
    let role = 'student';
    let isLogin = true;

    function setRole(r) {
      role = r;
      const studentBtn = document.querySelector('.role-btn.student');
      const teacherBtn = document.querySelector('.role-btn.teacher');
      const submitBtn = document.getElementById('submit-btn');
      const toggleLink = document.getElementById('toggle-link');
      const gradeField = document.getElementById('grade-field');
      const subjectField = document.getElementById('subject-field');

      studentBtn.classList.toggle('active', r === 'student');
      teacherBtn.classList.toggle('active', r === 'teacher');

      submitBtn.className = 'submit-btn ' + r;
      toggleLink.className = r;

      if (!isLogin) {
        gradeField.classList.toggle('hidden', r !== 'student');
        subjectField.classList.toggle('hidden', r !== 'teacher');
      }
    }

    function toggleLogin(e) {
      e.preventDefault();
      isLogin = !isLogin;

      const nameField = document.getElementById('name-field');
      const gradeField = document.getElementById('grade-field');
      const subjectField = document.getElementById('subject-field');
      const toggleLabel = document.getElementById('toggle-label');
      const toggleLink = document.getElementById('toggle-link');
      const submitBtn = document.getElementById('submit-btn');

      nameField.classList.toggle('hidden', isLogin);
      
      if (!isLogin) {
        gradeField.classList.toggle('hidden', role !== 'student');
        subjectField.classList.toggle('hidden', role !== 'teacher');
      } else {
        gradeField.classList.add('hidden');
        subjectField.classList.add('hidden');
      }

      toggleLabel.textContent = isLogin ? "Don't have an account?" : "Already have an account?";
      toggleLink.textContent = isLogin ? 'Sign up' : 'Sign in';
      submitBtn.textContent = isLogin ? 'Sign In' : 'Create Account';
    }

    function handleSubmit(e) {
      e.preventDefault();
      // For demo, just redirect to dashboard
      window.location.href = role === 'teacher' ? 'teacher-dashboard.html' : '/student';
    }
  </script>
</body>
</html>
