<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>EduPilot - Student & Teacher Platform</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans SC', Roboto, sans-serif;
      background: linear-gradient(180deg, #eff6ff 0%, #ffffff 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .container {
      width: 100%;
      max-width: 420px;
    }

    /* Header */
    .header {
      display: flex;
      justify-content: flex-end;
      margin-bottom: 20px;
    }

    .lang-toggle {
      display: flex;
      background: white;
      border-radius: 10px;
      overflow: hidden;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
    }

    .lang-btn {
      padding: 6px 14px;
      background: none;
      border: none;
      color: #64748b;
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
    }

    .lang-btn.active {
      background: linear-gradient(135deg, #3b82f6, #1d4ed8);
      color: white;
    }

    /* Logo */
    .logo {
      text-align: center;
      margin-bottom: 32px;
    }

    .logo-icon {
      font-size: 72px;
      margin-bottom: 12px;
    }

    .logo-text {
      font-size: 32px;
      font-weight: 900;
      background: linear-gradient(135deg, #1e3a5f, #3b82f6);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      letter-spacing: -0.5px;
    }

    .logo-tagline {
      font-size: 14px;
      color: #94a3b8;
      margin-top: 6px;
    }

    /* Platform Selection */
    .platform-select {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 16px;
      margin-bottom: 24px;
    }

    .platform-card {
      background: white;
      border: 3px solid #e2e8f0;
      border-radius: 20px;
      padding: 24px 16px;
      text-align: center;
      cursor: pointer;
      transition: all 0.3s;
    }

    .platform-card:hover {
      border-color: #3b82f6;
      transform: translateY(-4px);
      box-shadow: 0 8px 24px rgba(59, 130, 246, 0.15);
    }

    .platform-card.selected-student {
      border-color: #10b981;
      background: linear-gradient(180deg, #ecfdf5 0%, #ffffff 100%);
      box-shadow: 0 8px 24px rgba(16, 185, 129, 0.2);
    }

    .platform-card.selected-teacher {
      border-color: #8b5cf6;
      background: linear-gradient(180deg, #f5f3ff 0%, #ffffff 100%);
      box-shadow: 0 8px 24px rgba(139, 92, 246, 0.2);
    }

    .platform-icon {
      font-size: 48px;
      margin-bottom: 12px;
    }

    .platform-name {
      font-size: 18px;
      font-weight: 800;
      margin-bottom: 4px;
    }

    .platform-card.selected-student .platform-name {
      color: #059669;
    }

    .platform-card.selected-teacher .platform-name {
      color: #7c3aed;
    }

    .platform-desc {
      font-size: 12px;
      color: #94a3b8;
    }

    /* Card */
    .card {
      background: white;
      border-radius: 20px;
      padding: 28px 24px;
      box-shadow: 0 4px 24px rgba(0,0,0,0.06);
    }

    /* Tab Switcher */
    .tab-switcher {
      display: flex;
      background: #f8fafc;
      border-radius: 12px;
      padding: 4px;
      margin-bottom: 24px;
    }

    .tab-btn {
      flex: 1;
      padding: 12px;
      border: none;
      background: none;
      border-radius: 10px;
      font-size: 14px;
      font-weight: 600;
      color: #64748b;
      cursor: pointer;
      transition: all 0.2s;
    }

    .tab-btn.active {
      background: white;
      color: #3b82f6;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
      font-weight: 700;
    }

    /* Form */
    .form-title {
      font-size: 22px;
      font-weight: 800;
      color: #1e293b;
      margin-bottom: 20px;
      text-align: center;
    }

    .form-group {
      margin-bottom: 16px;
    }

    .form-label {
      display: block;
      font-size: 13px;
      font-weight: 600;
      color: #475569;
      margin-bottom: 8px;
    }

    .form-input {
      width: 100%;
      padding: 14px 16px;
      border: 2px solid #e2e8f0;
      border-radius: 12px;
      font-size: 15px;
      transition: all 0.2s;
      background: #f8fafc;
    }

    .form-input:focus {
      outline: none;
      border-color: #3b82f6;
      background: white;
    }

    .submit-btn {
      width: 100%;
      padding: 16px;
      border: none;
      border-radius: 12px;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
      margin-top: 8px;
      transition: all 0.2s;
    }

    .submit-btn.student-btn {
      background: linear-gradient(135deg, #10b981, #059669);
      color: white;
    }

    .submit-btn.teacher-btn {
      background: linear-gradient(135deg, #8b5cf6, #7c3aed);
      color: white;
    }

    .submit-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 16px rgba(0,0,0,0.15);
    }

    .submit-btn:disabled {
      background: #cbd5e1;
      cursor: not-allowed;
      transform: none;
      box-shadow: none;
    }

    .forgot-link {
      text-align: center;
      margin-top: 18px;
    }

    .forgot-link a {
      color: #3b82f6;
      font-size: 13px;
      font-weight: 600;
      text-decoration: none;
    }

    .error-msg {
      background: #fef2f2;
      color: #dc2626;
      padding: 12px;
      border-radius: 10px;
      font-size: 13px;
      margin-bottom: 16px;
      display: none;
    }

    .info-box {
      background: #eff6ff;
      border: 1px solid #bfdbfe;
      border-radius: 12px;
      padding: 14px;
      margin-bottom: 20px;
      text-align: center;
    }

    .info-box .icon {
      font-size: 24px;
      margin-bottom: 8px;
    }

    .info-box .text {
      font-size: 13px;
      color: #1e40af;
      font-weight: 600;
    }
  </style>
</head>
<body>
  <div class="container">
    <!-- Language Toggle -->
    <div class="header">
      <div class="lang-toggle">
        <button class="lang-btn active" onclick="setLang('en')">EN</button>
        <button class="lang-btn" onclick="setLang('zh')">中文</button>
      </div>
    </div>

    <!-- Logo -->
    <div class="logo">
      <div class="logo-icon">🎓</div>
      <div class="logo-text">EduPilot</div>
      <div class="logo-tagline" data-en="Learn • Play • Grow" data-zh="學習 • 遊戲 • 成長">Learn • Play • Grow</div>
    </div>

    <!-- Platform Selection -->
    <div class="platform-select">
      <div class="platform-card" onclick="selectPlatform('student')" id="student-card">
        <div class="platform-icon">👦</div>
        <div class="platform-name">Student Platform</div>
        <div class="platform-desc" data-en="Learn • Play • Grow" data-zh="學習 • 遊戲 • 成長">Learn • Play • Grow</div>
      </div>
      <div class="platform-card" onclick="selectPlatform('teacher')" id="teacher-card">
        <div class="platform-icon">👨‍🏫</div>
        <div class="platform-name">Teacher Platform</div>
        <div class="platform-desc" data-en="Manage • Teach • Inspire" data-zh="管理 • 教學 • 啟發">Manage • Teach • Inspire</div>
      </div>
    </div>

    <!-- Card -->
    <div class="card">
      <!-- Info Box -->
      <div class="info-box" id="platform-info" style="display: none;">
        <div class="icon" id="info-icon">👦</div>
        <div class="text" id="info-text"></div>
      </div>

      <div class="error-msg" id="errorMsg"></div>

      <!-- Tab Switcher -->
      <div class="tab-switcher">
        <button class="tab-btn active" id="loginTab" onclick="showLogin()" data-en="Login" data-zh="登入">Login</button>
        <button class="tab-btn" id="signupTab" onclick="showSignup()" data-en="Sign Up" data-zh="註冊">Sign Up</button>
      </div>

      <!-- Login Form -->
      <div id="loginForm">
        <div class="form-title" data-en="Welcome Back!" data-zh="歡迎回來!">Welcome Back!</div>
        
        <form onsubmit="handleLogin(event)">
          <div class="form-group">
            <label class="form-label" data-en="Email" data-zh="電郵">Email</label>
            <input type="email" class="form-input" id="loginEmail" placeholder="your@email.com" required>
          </div>
          
          <div class="form-group">
            <label class="form-label" data-en="Password" data-zh="密碼">Password</label>
            <input type="password" class="form-input" id="loginPassword" placeholder="••••••••" required>
          </div>
          
          <button type="submit" class="submit-btn" id="loginBtn" disabled data-en="Login" data-zh="登入">Login</button>
        </form>
        
        <div class="forgot-link">
          <a href="#" data-en="Forgot password?" data-zh="忘記密碼?">Forgot password?</a>
        </div>
      </div>

      <!-- Signup Form -->
      <div id="signupForm" style="display: none;">
        <div class="form-title" data-en="Create Account" data-zh="建立帳戶">Create Account</div>
        
        <form onsubmit="handleSignup(event)">
          <div class="form-group">
            <label class="form-label" data-en="Full Name" data-zh="姓名">Full Name</label>
            <input type="text" class="form-input" id="signupName" placeholder="Tommy Tsang" required>
          </div>
          
          <div class="form-group">
            <label class="form-label" data-en="Email" data-zh="電郵">Email</label>
            <input type="email" class="form-input" id="signupEmail" placeholder="your@email.com" required>
          </div>
          
          <div class="form-group">
            <label class="form-label" data-en="Password" data-zh="密碼">Password</label>
            <input type="password" class="form-input" id="signupPassword" placeholder="••••••••" required minlength="6">
          </div>
          
          <button type="submit" class="submit-btn" id="signupBtn" disabled data-en="Create Account" data-zh="建立帳戶">Create Account</button>
        </form>
      </div>
    </div>
  </div>

  <!-- Supabase SDK -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  
  <script>
    // Supabase Configuration
    const SUPABASE_URL = 'https://zpyglubdgpecdfsrnirz.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InpweWdsdWJkZ3BlY2Rmc3JuaXJ6Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzg3NTYxNTksImV4cCI6MjA5NDMzMjE1OX0.IEBm33tSXSS7p1ivjXGNowAbyk7uYQTBCSrZJZ68maU';
    
    const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    let currentLang = 'en';
    let selectedPlatform = null;

    function setLang(lang) {
      currentLang = lang;
      
      document.querySelectorAll('.lang-btn').forEach(b => b.classList.remove('active'));
      if (lang === 'en') {
        document.querySelector('.lang-btn:first-child').classList.add('active');
      } else {
        document.querySelector('.lang-btn:last-child').classList.add('active');
      }
      
      document.querySelectorAll('[data-en]').forEach(el => {
        el.textContent = el.getAttribute(`data-${lang}`);
      });
      
      localStorage.setItem('lang', lang);
    }

    const savedLang = localStorage.getItem('lang');
    if (savedLang) setLang(savedLang);

    function selectPlatform(platform) {
      selectedPlatform = platform;
      
      // Update card styles
      document.getElementById('student-card').classList.remove('selected-student');
      document.getElementById('teacher-card').classList.remove('selected-teacher');
      
      if (platform === 'student') {
        document.getElementById('student-card').classList.add('selected-student');
        document.getElementById('loginBtn').classList.add('student-btn');
        document.getElementById('loginBtn').classList.remove('teacher-btn');
        document.getElementById('signupBtn').classList.add('student-btn');
        document.getElementById('signupBtn').classList.remove('teacher-btn');
        document.getElementById('info-icon').textContent = '👦';
        document.getElementById('info-text').textContent = currentLang === 'zh' ? '學生平台已選擇' : 'Student Platform Selected';
      } else {
        document.getElementById('teacher-card').classList.add('selected-teacher');
        document.getElementById('loginBtn').classList.add('teacher-btn');
        document.getElementById('loginBtn').classList.remove('student-btn');
        document.getElementById('signupBtn').classList.add('teacher-btn');
        document.getElementById('signupBtn').classList.remove('student-btn');
        document.getElementById('info-icon').textContent = '👨‍🏫';
        document.getElementById('info-text').textContent = currentLang === 'zh' ? '老師平台已選擇' : 'Teacher Platform Selected';
      }
      
      document.getElementById('platform-info').style.display = 'block';
      document.getElementById('loginBtn').disabled = false;
      document.getElementById('signupBtn').disabled = false;
    }

    function showLogin() {
      document.getElementById('loginForm').style.display = 'block';
      document.getElementById('signupForm').style.display = 'none';
      document.getElementById('loginTab').classList.add('active');
      document.getElementById('signupTab').classList.remove('active');
    }

    function showSignup() {
      document.getElementById('loginForm').style.display = 'none';
      document.getElementById('signupForm').style.display = 'block';
      document.getElementById('loginTab').classList.remove('active');
      document.getElementById('signupTab').classList.add('active');
    }

    function showError(msg) {
      const errorEl = document.getElementById('errorMsg');
      errorEl.textContent = msg;
      errorEl.style.display = 'block';
    }

    function hideError() {
      document.getElementById('errorMsg').style.display = 'none';
    }

    async function handleLogin(e) {
      e.preventDefault();
      hideError();
      
      if (!selectedPlatform) {
        showError(currentLang === 'zh' ? '請選擇學生或老師平台' : 'Please select Student or Teacher Platform');
        return;
      }

      const email = document.getElementById('loginEmail').value;
      const password = document.getElementById('loginPassword').value;
      
      const btn = document.getElementById('loginBtn');
      btn.textContent = currentLang === 'zh' ? '登入中...' : 'Logging in...';
      btn.disabled = true;
      
      const { data, error } = await supabase.auth.signInWithPassword({
        email,
        password
      });
      
      if (error) {
        showError(error.message);
        btn.textContent = currentLang === 'zh' ? '登入' : 'Login';
        btn.disabled = false;
        return;
      }
      
      // Check user role
      const { data: userData } = await supabase
        .from('users')
        .select('role')
        .eq('id', data.user.id)
        .single();
      
      if (userData && userData.role !== selectedPlatform) {
        showError(currentLang === 'zh' 
          ? `此帳號是${userData.role === 'student' ? '學生' : '老師'}帳號，請選擇正確的平台` 
          : `This account is a ${userData.role}. Please select the correct platform.`);
        await supabase.auth.signOut();
        btn.textContent = currentLang === 'zh' ? '登入' : 'Login';
        btn.disabled = false;
        return;
      }
      
      // Redirect based on platform
      if (selectedPlatform === 'student') {
        window.location.href = 'student-dashboard-full.html';
      } else {
        window.location.href = 'teacher-dashboard.html';
      }
    }

    async function handleSignup(e) {
      e.preventDefault();
      hideError();
      
      if (!selectedPlatform) {
        showError(currentLang === 'zh' ? '請選擇學生或老師平台' : 'Please select Student or Teacher Platform');
        return;
      }

      const name = document.getElementById('signupName').value;
      const email = document.getElementById('signupEmail').value;
      const password = document.getElementById('signupPassword').value;
      
      const btn = document.getElementById('signupBtn');
      btn.textContent = currentLang === 'zh' ? '建立帳戶中...' : 'Creating account...';
      btn.disabled = true;
      
      const { data, error } = await supabase.auth.signUp({
        email,
        password,
        options: {
          data: {
            name: name,
            role: selectedPlatform
          }
        }
      });
      
      if (error) {
        showError(error.message);
        btn.textContent = currentLang === 'zh' ? '建立帳戶' : 'Create Account';
        btn.disabled = false;
        return;
      }
      
      // Create user record
      if (data.user) {
        await supabase.from('users').insert({
          id: data.user.id,
          email: email,
          name: name,
          role: selectedPlatform,
          points: 0,
          level: 1
        });
      }
      
      alert(currentLang === 'zh' ? '帳戶建立成功!請查收確認郵件。' : 'Account created! Please check your email to confirm.');
      
      showLogin();
      btn.textContent = currentLang === 'zh' ? '建立帳戶' : 'Create Account';
      btn.disabled = false;
    }

    // Check if already logged in
    supabase.auth.onAuthStateChange((event, session) => {
      if (event === 'SIGNED_IN' && session) {
        // User is logged in
      }
    });
  </script>
</body>
</html>
