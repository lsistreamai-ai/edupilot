<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>EduPilot - Learning Platform</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans SC', Roboto, sans-serif;
      background: linear-gradient(180deg, #eff6ff 0%, #ffffff 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .container {
      width: 100%;
      max-width: 420px;
    }

    /* Header */
    .header {
      display: flex;
      justify-content: flex-end;
      margin-bottom: 20px;
    }

    .lang-toggle {
      display: flex;
      background: white;
      border-radius: 10px;
      overflow: hidden;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
    }

    .lang-btn {
      padding: 6px 14px;
      background: none;
      border: none;
      color: #64748b;
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
    }

    .lang-btn.active {
      background: linear-gradient(135deg, #3b82f6, #1d4ed8);
      color: white;
    }

    /* Logo */
    .logo {
      text-align: center;
      margin-bottom: 28px;
    }

    .logo-icon {
      font-size: 64px;
      margin-bottom: 12px;
    }

    .logo-text {
      font-size: 28px;
      font-weight: 900;
      color: #1e293b;
      letter-spacing: -0.5px;
    }

    .logo-tagline {
      font-size: 13px;
      color: #94a3b8;
      margin-top: 6px;
    }

    /* Card */
    .card {
      background: white;
      border-radius: 20px;
      padding: 28px 24px;
      box-shadow: 0 4px 24px rgba(0,0,0,0.06);
    }

    /* Tab Switcher */
    .tab-switcher {
      display: flex;
      background: #f8fafc;
      border-radius: 12px;
      padding: 4px;
      margin-bottom: 24px;
    }

    .tab-btn {
      flex: 1;
      padding: 12px;
      border: none;
      background: none;
      border-radius: 10px;
      font-size: 14px;
      font-weight: 600;
      color: #64748b;
      cursor: pointer;
      transition: all 0.2s;
    }

    .tab-btn.active {
      background: white;
      color: #3b82f6;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
      font-weight: 700;
    }

    /* Form */
    .form-title {
      font-size: 22px;
      font-weight: 800;
      color: #1e293b;
      margin-bottom: 24px;
      text-align: center;
    }

    .form-group {
      margin-bottom: 18px;
    }

    .form-label {
      display: block;
      font-size: 13px;
      font-weight: 600;
      color: #475569;
      margin-bottom: 8px;
    }

    .form-input {
      width: 100%;
      padding: 14px 16px;
      border: 2px solid #e2e8f0;
      border-radius: 12px;
      font-size: 15px;
      transition: all 0.2s;
      background: #f8fafc;
    }

    .form-input:focus {
      outline: none;
      border-color: #3b82f6;
      background: white;
    }

    .form-input::placeholder {
      color: #94a3b8;
    }

    .role-select {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 12px;
    }

    .role-option {
      padding: 16px;
      border: 2px solid #e2e8f0;
      border-radius: 12px;
      text-align: center;
      cursor: pointer;
      transition: all 0.2s;
      background: #f8fafc;
    }

    .role-option:hover {
      border-color: #3b82f6;
      background: white;
    }

    .role-option.selected {
      border-color: #3b82f6;
      background: #eff6ff;
    }

    .role-icon {
      font-size: 32px;
      margin-bottom: 6px;
    }

    .role-label {
      font-size: 14px;
      font-weight: 600;
      color: #1e293b;
    }

    .submit-btn {
      width: 100%;
      padding: 16px;
      background: linear-gradient(135deg, #3b82f6, #1d4ed8);
      color: white;
      border: none;
      border-radius: 12px;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
      margin-top: 8px;
      transition: all 0.2s;
    }

    .submit-btn:hover {
      transform: translateY(-1px);
      box-shadow: 0 4px 12px rgba(59, 130, 246, 0.4);
    }

    .forgot-link {
      text-align: center;
      margin-top: 18px;
    }

    .forgot-link a {
      color: #3b82f6;
      font-size: 13px;
      font-weight: 600;
      text-decoration: none;
    }
  </style>
</head>
<body>
  <div class="container">
    <!-- Language Toggle -->
    <div class="header">
      <div class="lang-toggle">
        <button class="lang-btn active" onclick="setLang('en')">EN</button>
        <button class="lang-btn" onclick="setLang('zh')">中文</button>
      </div>
    </div>

    <!-- Logo -->
    <div class="logo">
      <div class="logo-icon">🎓</div>
      <div class="logo-text">EduPilot</div>
      <div class="logo-tagline" data-en="Learn • Play • Grow" data-zh="學習 • 遊戲 • 成長">Learn • Play • Grow</div>
    </div>

    <!-- Card -->
    <div class="card">
      <!-- Tab Switcher -->
      <div class="tab-switcher">
        <button class="tab-btn active" id="loginTab" onclick="showLogin()" data-en="Login" data-zh="登入">Login</button>
        <button class="tab-btn" id="signupTab" onclick="showSignup()" data-en="Sign Up" data-zh="註冊">Sign Up</button>
      </div>

      <!-- Login Form -->
      <div id="loginForm">
        <div class="form-title" data-en="Welcome Back!" data-zh="歡迎回來!">Welcome Back!</div>
        
        <form onsubmit="handleLogin(event)">
          <div class="form-group">
            <label class="form-label" data-en="Email" data-zh="電郵">Email</label>
            <input type="email" class="form-input" placeholder="your@email.com" required>
          </div>
          
          <div class="form-group">
            <label class="form-label" data-en="Password" data-zh="密碼">Password</label>
            <input type="password" class="form-input" placeholder="••••••••" required>
          </div>
          
          <button type="submit" class="submit-btn" data-en="Login" data-zh="登入">Login</button>
        </form>
        
        <div class="forgot-link">
          <a href="#" data-en="Forgot password?" data-zh="忘記密碼?">Forgot password?</a>
        </div>
      </div>

      <!-- Signup Form -->
      <div id="signupForm" style="display: none;">
        <div class="form-title" data-en="Create Account" data-zh="建立帳戶">Create Account</div>
        
        <form onsubmit="handleSignup(event)">
          <div class="form-group">
            <label class="form-label" data-en="Full Name" data-zh="姓名">Full Name</label>
            <input type="text" class="form-input" placeholder="Tommy Tsang" required>
          </div>
          
          <div class="form-group">
            <label class="form-label" data-en="Email" data-zh="電郵">Email</label>
            <input type="email" class="form-input" placeholder="your@email.com" required>
          </div>
          
          <div class="form-group">
            <label class="form-label" data-en="Password" data-zh="密碼">Password</label>
            <input type="password" class="form-input" placeholder="••••••••" required minlength="6">
          </div>
          
          <div class="form-group">
            <label class="form-label" data-en="I am a..." data-zh="我是...">I am a...</label>
            <div class="role-select">
              <div class="role-option" onclick="selectRole(this, 'student')">
                <div class="role-icon">👦</div>
                <div class="role-label" data-en="Student" data-zh="學生">Student</div>
              </div>
              <div class="role-option" onclick="selectRole(this, 'teacher')">
                <div class="role-icon">👨‍🏫</div>
                <div class="role-label" data-en="Teacher" data-zh="老師">Teacher</div>
              </div>
            </div>
            <input type="hidden" id="selectedRole" value="">
          </div>
          
          <button type="submit" class="submit-btn" data-en="Create Account" data-zh="建立帳戶">Create Account</button>
        </form>
      </div>
    </div>
  </div>

  <script>
    let currentLang = 'en';

    function setLang(lang) {
      currentLang = lang;
      
      document.querySelectorAll('.lang-btn').forEach(b => b.classList.remove('active'));
      if (lang === 'en') {
        document.querySelector('.lang-btn:first-child').classList.add('active');
      } else {
        document.querySelector('.lang-btn:last-child').classList.add('active');
      }
      
      document.querySelectorAll('[data-en]').forEach(el => {
        el.textContent = el.getAttribute(`data-${lang}`);
      });
      
      localStorage.setItem('lang', lang);
    }

    const savedLang = localStorage.getItem('lang');
    if (savedLang) setLang(savedLang);

    function showLogin() {
      document.getElementById('loginForm').style.display = 'block';
      document.getElementById('signupForm').style.display = 'none';
      document.getElementById('loginTab').classList.add('active');
      document.getElementById('signupTab').classList.remove('active');
    }

    function showSignup() {
      document.getElementById('loginForm').style.display = 'none';
      document.getElementById('signupForm').style.display = 'block';
      document.getElementById('loginTab').classList.remove('active');
      document.getElementById('signupTab').classList.add('active');
    }

    function selectRole(el, role) {
      document.querySelectorAll('.role-option').forEach(o => o.classList.remove('selected'));
      el.classList.add('selected');
      document.getElementById('selectedRole').value = role;
    }

    function handleLogin(e) {
      e.preventDefault();
      alert(currentLang === 'zh' ? '登入成功!' : 'Login successful!');
      location.href = 'student-dashboard-full.html';
    }

    function handleSignup(e) {
      e.preventDefault();
      const role = document.getElementById('selectedRole').value;
      
      if (!role) {
        alert(currentLang === 'zh' ? '請選擇學生或老師' : 'Please select Student or Teacher');
        return;
      }
      
      alert(currentLang === 'zh' ? '註冊成功!' : 'Account created!');
      location.href = role === 'teacher' ? 'teacher' : 'student-dashboard-full.html';
    }
  </script>
</body>
</html>
