<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Student Dashboard - EduPilot</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans SC', sans-serif;
      background: linear-gradient(180deg, #eff6ff 0%, #f0f9ff 100%);
      min-height: 100vh;
    }
    .header {
      position: sticky;
      top: 0;
      background: linear-gradient(135deg, #3b82f6, #1d4ed8);
      color: white;
      z-index: 100;
      padding: 14px 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .logo { font-size: 20px; font-weight: 800; }
    .logout-btn { background: rgba(255,255,255,0.2); border: none; color: white; padding: 8px 16px; border-radius: 12px; font-weight: 600; cursor: pointer; }
    .main { padding: 20px 16px; padding-bottom: 100px; max-width: 600px; margin: 0 auto; }
    
    .profile-card {
      background: white;
      border-radius: 24px;
      padding: 32px 24px;
      text-align: center;
      margin-bottom: 20px;
      box-shadow: 0 4px 20px rgba(59, 130, 246, 0.15);
    }
    .avatar { font-size: 64px; margin-bottom: 16px; }
    .name { font-size: 28px; font-weight: 800; color: #1e293b; margin-bottom: 4px; }
    .class-info { font-size: 16px; color: #64748b; margin-bottom: 20px; }
    
    .stats-row { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin-bottom: 24px; }
    .stat-box { background: #f8fafc; border-radius: 16px; padding: 16px; text-align: center; }
    .stat-value { font-size: 24px; font-weight: 800; color: #3b82f6; }
    .stat-label { font-size: 12px; color: #64748b; margin-top: 4px; }
    
    .section-title { font-size: 20px; font-weight: 800; color: #1e293b; margin-bottom: 16px; }
    
    .setup-card {
      background: white;
      border-radius: 20px;
      padding: 24px;
      margin-bottom: 16px;
      border: 3px solid #f1f5f9;
    }
    .setup-card:hover { border-color: #3b82f6; }
    .setup-title { font-size: 18px; font-weight: 800; color: #1e293b; margin-bottom: 8px; }
    .setup-desc { font-size: 14px; color: #64748b; margin-bottom: 16px; line-height: 1.5; }
    .setup-btn {
      width: 100%;
      background: linear-gradient(135deg, #3b82f6, #1d4ed8);
      color: white;
      border: none;
      padding: 14px;
      border-radius: 12px;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
    }
    
    .subject-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; }
    .subject-card {
      background: white;
      border-radius: 16px;
      padding: 20px;
      text-align: center;
      box-shadow: 0 2px 8px rgba(0,0,0,0.06);
    }
    .subject-icon { font-size: 36px; margin-bottom: 8px; }
    .subject-name { font-size: 14px; font-weight: 700; color: #1e293b; }
    
    .bottom-nav {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      background: white;
      padding: 12px 20px;
      display: flex;
      justify-content: space-around;
      box-shadow: 0 -2px 20px rgba(0,0,0,0.08);
    }
    .nav-item { text-align: center; color: #94a3b8; font-size: 12px; }
    .nav-item.active { color: #3b82f6; }
    .nav-icon { font-size: 24px; margin-bottom: 4px; }
  </style>
</head>
<body>
  <header class="header">
    <div class="logo">🎓 EduPilot</div>
    <button class="logout-btn" onclick="logout()">Log Out</button>
  </header>

  <main class="main" id="mainContent">
    <!-- Profile -->
    <div class="profile-card">
      <div class="avatar">👦</div>
      <div class="name" id="userName">Student</div>
      <div class="class-info" id="classInfo">Ready to learn!</div>
      
      <div class="stats-row">
        <div class="stat-box">
          <div class="stat-value" id="points">0</div>
          <div class="stat-label">Points</div>
        </div>
        <div class="stat-box">
          <div class="stat-value" id="level">1</div>
          <div class="stat-label">Level</div>
        </div>
        <div class="stat-box">
          <div class="stat-value" id="streak">🔥</div>
          <div class="stat-label">Streak</div>
        </div>
      </div>
    </div>

    <!-- Join Class -->
    <div class="section-title">📚 My Classes</div>
    <div class="setup-card">
      <div class="setup-title">Join a Class</div>
      <div class="setup-desc">Enter your class code from your teacher to join your class and see your subjects.</div>
      <button class="setup-btn" onclick="showJoinModal()">Join Class</button>
    </div>

    <!-- Subjects -->
    <div class="section-title" style="margin-top: 24px;">📖 Subjects</div>
    <div class="subject-grid" id="subjectsGrid">
      <div class="subject-card">
        <div class="subject-icon">🇨🇳</div>
        <div class="subject-name">Chinese</div>
      </div>
      <div class="subject-card">
        <div class="subject-icon">🇬🇧</div>
        <div class="subject-name">English</div>
      </div>
      <div class="subject-card">
        <div class="subject-icon">🔢</div>
        <div class="subject-name">Math</div>
      </div>
      <div class="subject-card">
        <div class="subject-icon">🔬</div>
        <div class="subject-name">Science</div>
      </div>
    </div>
  </main>

  <nav class="bottom-nav">
    <div class="nav-item active">
      <div class="nav-icon">🏠</div>
      Home
    </div>
    <div class="nav-item">
      <div class="nav-icon">📚</div>
      Learn
    </div>
    <div class="nav-item">
      <div class="nav-icon">🏆</div>
      Rewards
    </div>
    <div class="nav-item">
      <div class="nav-icon">👤</div>
      Profile
    </div>
  </nav>

  <!-- Join Class Modal -->
  <div id="joinModal" style="display:none; position:fixed; top:0; left:0; right:0; bottom:0; background:rgba(0,0,0,0.5); z-index:200; align-items:center; justify-content:center; padding:20px;">
    <div style="background:white; border-radius:24px; padding:24px; max-width:400px; width:100%;">
      <h2 style="font-size:24px; font-weight:800; margin-bottom:16px;">Join Class</h2>
      <input type="text" id="classCode" placeholder="Enter class code (e.g., P4CS21)" style="width:100%; padding:14px; border:2px solid #e2e8f0; border-radius:12px; font-size:16px; margin-bottom:16px;">
      <button onclick="joinClass()" style="width:100%; background:linear-gradient(135deg, #3b82f6, #1d4ed8); color:white; border:none; padding:14px; border-radius:12px; font-size:16px; font-weight:700; cursor:pointer;">Join</button>
      <button onclick="closeJoinModal()" style="width:100%; background:none; border:none; color:#64748b; padding:14px; font-size:16px; cursor:pointer;">Cancel</button>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    var supabase = window.supabase.createClient(
      'https://zpyglubdgpecdfsrnirz.supabase.co',
      'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InpweWdsdWJkZ3BlY2Rmc3JuaXJ6Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzg3NTYxNTksImV4cCI6MjA5NDMzMjE1OX0.IEBm33tSXSS7p1ivjXGNowAbyk7uYQTBCSrZJZ68maU'
    );

    window.onload = async function() {
      var sess = await supabase.auth.getSession();
      if (!sess.data.session) {
        window.location.href = 'index.html';
        return;
      }
      
      var user = sess.data.session.user;
      var userResult = await supabase.from('users').select('*').eq('id', user.id).single();
      
      if (userResult.data) {
        document.getElementById('userName').textContent = userResult.data.full_name || 'Student';
        document.getElementById('points').textContent = userResult.data.points || 0;
        document.getElementById('level').textContent = userResult.data.level || 1;
      }
    };

    function showJoinModal() {
      document.getElementById('joinModal').style.display = 'flex';
    }

    function closeJoinModal() {
      document.getElementById('joinModal').style.display = 'none';
    }

    async function joinClass() {
      var code = document.getElementById('classCode').value.toUpperCase();
      if (!code) {
        alert('Please enter a class code');
        return;
      }
      alert('Joined class: ' + code);
      closeJoinModal();
    }

    async function logout() {
      await supabase.auth.signOut();
      window.location.href = 'index.html';
    }
  </script>
</body>
</html>
