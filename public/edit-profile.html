<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Edit Profile - EduPilot</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans SC', Roboto, sans-serif;
      background: #f0f9ff;
      min-height: 100vh;
    }

    /* Header */
    .header {
      position: sticky;
      top: 0;
      background: linear-gradient(135deg, #3b82f6, #1d4ed8);
      color: white;
      z-index: 100;
    }

    .header-content {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 14px 16px;
    }

    .header-left {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .back-btn {
      background: rgba(255,255,255,0.2);
      border: none;
      width: 40px;
      height: 40px;
      border-radius: 12px;
      font-size: 22px;
      cursor: pointer;
      color: white;
    }

    .header-title {
      font-size: 18px;
      font-weight: 800;
    }

    /* Language Toggle */
    .lang-toggle {
      display: flex;
      background: rgba(255,255,255,0.2);
      border-radius: 12px;
      overflow: hidden;
    }

    .lang-btn {
      padding: 8px 12px;
      background: none;
      border: none;
      color: rgba(255,255,255,0.7);
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
    }

    .lang-btn.active {
      background: rgba(255,255,255,0.3);
      color: white;
    }

    /* Main Content */
    .main {
      padding: 20px 16px;
      padding-bottom: 100px;
    }

    /* Avatar Section */
    .avatar-section {
      text-align: center;
      margin-bottom: 20px;
    }

    .avatar-display {
      width: 80px;
      height: 80px;
      border-radius: 50%;
      background: linear-gradient(135deg, #dbeafe, #bfdbfe);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 40px;
      margin: 0 auto;
      border: 3px solid white;
      box-shadow: 0 4px 16px rgba(0,0,0,0.1);
    }

    .section-title {
      font-size: 14px;
      font-weight: 700;
      color: #64748b;
      margin-bottom: 10px;
      margin-top: 20px;
    }

    /* Avatar Picker - SMALLER */
    .avatar-grid {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 8px;
      margin-bottom: 16px;
    }

    .avatar-option {
      width: 48px;
      height: 48px;
      border-radius: 50%;
      background: #f8fafc;
      border: 2px solid #e2e8f0;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 22px;
      cursor: pointer;
      transition: all 0.2s;
      justify-self: center;
    }

    .avatar-option:hover {
      border-color: #3b82f6;
    }

    .avatar-option.selected {
      border-color: #3b82f6;
      background: #eff6ff;
    }

    /* Form Card */
    .form-card {
      background: white;
      border-radius: 16px;
      padding: 16px;
      margin-bottom: 12px;
      border: 2px solid #f1f5f9;
    }

    .form-group {
      margin-bottom: 14px;
    }

    .form-label {
      display: block;
      font-size: 13px;
      font-weight: 700;
      color: #1e293b;
      margin-bottom: 6px;
    }

    .form-input {
      width: 100%;
      padding: 12px 14px;
      border: 2px solid #e2e8f0;
      border-radius: 10px;
      font-size: 15px;
      transition: border-color 0.2s;
    }

    .form-input:focus {
      outline: none;
      border-color: #3b82f6;
    }

    /* Save Button */
    .save-btn {
      width: 100%;
      padding: 14px;
      background: linear-gradient(135deg, #3b82f6, #1d4ed8);
      color: white;
      border: none;
      border-radius: 12px;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      margin-top: 8px;
    }

    /* Bottom Navigation */
    .bottom-nav {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      background: white;
      border-top: 2px solid #e2e8f0;
      z-index: 50;
      padding-bottom: env(safe-area-inset-bottom);
    }

    .nav-content {
      display: flex;
      justify-content: space-around;
      padding: 8px 0 12px;
    }

    .nav-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      padding: 8px 16px;
      background: none;
      border: none;
      color: #94a3b8;
      cursor: pointer;
    }

    .nav-item.active { color: #3b82f6; }
    .nav-item .icon { font-size: 28px; }
    .nav-item .label { font-size: 12px; font-weight: 700; }
  </style>
</head>
<body>
  <!-- Header -->
  <header class="header">
    <div class="header-content">
      <div class="header-left">
        <button class="back-btn" onclick="location.href='student-dashboard-full.html'">←</button>
        <span class="header-title" data-en="Edit Profile" data-zh="編輯資料">Edit Profile</span>
      </div>
      <div class="lang-toggle">
        <button class="lang-btn active" onclick="setLang('en')">EN</button>
        <button class="lang-btn" onclick="setLang('zh')">中文</button>
      </div>
    </div>
  </header>

  <!-- Main Content -->
  <main class="main">
    <!-- Avatar Display -->
    <div class="avatar-section">
      <div class="avatar-display" id="avatarDisplay">👦</div>
    </div>

    <!-- Name Input First -->
    <div class="form-card">
      <div class="form-group" style="margin-bottom: 0;">
        <label class="form-label" data-en="Display Name" data-zh="顯示名稱">Display Name</label>
        <input type="text" class="form-input" id="userName" placeholder="Enter your name" maxlength="20">
      </div>
    </div>

    <!-- Avatar Picker - More compact -->
    <div class="section-title" data-en="Choose Avatar" data-zh="選擇頭像">Choose Avatar</div>
    <div class="avatar-grid">
      <div class="avatar-option selected" onclick="selectAvatar(this, '👦')">👦</div>
      <div class="avatar-option" onclick="selectAvatar(this, '👧')">👧</div>
      <div class="avatar-option" onclick="selectAvatar(this, '🧒')">🧒</div>
      <div class="avatar-option" onclick="selectAvatar(this, '👦🏻')">👦🏻</div>
      <div class="avatar-option" onclick="selectAvatar(this, '👧🏻')">👧🏻</div>
      <div class="avatar-option" onclick="selectAvatar(this, '🧑')">🧑</div>
      <div class="avatar-option" onclick="selectAvatar(this, '👩')">👩</div>
      <div class="avatar-option" onclick="selectAvatar(this, '👨')">👨</div>
      <div class="avatar-option" onclick="selectAvatar(this, '🧑‍🎓')">🧑‍🎓</div>
      <div class="avatar-option" onclick="selectAvatar(this, '🎭')">🎭</div>
    </div>

    <!-- Save Button -->
    <button class="save-btn" onclick="saveProfile()">
      <span data-en="Save Changes" data-zh="儲存變更">Save Changes</span>
    </button>
  </main>

  <!-- Bottom Navigation -->
  <nav class="bottom-nav">
    <div class="nav-content">
      <button class="nav-item" onclick="location.href='student-dashboard-full.html'">
        <span class="icon">🏠</span>
        <span class="label" data-en="Home" data-zh="主頁">Home</span>
      </button>
      <button class="nav-item">
        <span class="icon">📚</span>
        <span class="label" data-en="Learn" data-zh="學習">Learn</span>
      </button>
      <button class="nav-item">
        <span class="icon">🏆</span>
        <span class="label" data-en="Ranks" data-zh="排名">Ranks</span>
      </button>
      <button class="nav-item active">
        <span class="icon" style="font-size: 24px;">👦</span>
        <span class="label" data-en="Me" data-zh="我">Me</span>
      </button>
    </div>
  </nav>

  <script>
    // Language
    let currentLang = 'en';

    function setLang(lang) {
      currentLang = lang;
      
      document.querySelectorAll('.lang-btn').forEach(b => b.classList.remove('active'));
      if (lang === 'en') {
        document.querySelector('.lang-btn:first-child').classList.add('active');
      } else {
        document.querySelector('.lang-btn:last-child').classList.add('active');
      }
      
      document.querySelectorAll('[data-en]').forEach(el => {
        el.textContent = el.getAttribute(`data-${lang}`);
      });
      
      localStorage.setItem('lang', lang);
    }

    const savedLang = localStorage.getItem('lang');
    if (savedLang) setLang(savedLang);

    // Avatar Selection
    let selectedAvatar = '👦';

    function selectAvatar(el, emoji) {
      document.querySelectorAll('.avatar-option').forEach(a => a.classList.remove('selected'));
      el.classList.add('selected');
      selectedAvatar = emoji;
      document.getElementById('avatarDisplay').textContent = emoji;
    }

    // Load saved data
    const savedName = localStorage.getItem('userName');
    const savedAvatar = localStorage.getItem('userAvatar');
    
    if (savedName) document.getElementById('userName').value = savedName;
    if (savedAvatar) {
      selectedAvatar = savedAvatar;
      document.getElementById('avatarDisplay').textContent = savedAvatar;
      document.querySelectorAll('.avatar-option').forEach(a => {
        if (a.textContent === savedAvatar) a.classList.add('selected');
        else a.classList.remove('selected');
      });
    }

    // Save Profile
    function saveProfile() {
      const name = document.getElementById('userName').value.trim();
      
      if (!name) {
        alert(currentLang === 'zh' ? '請輸入你的名稱' : 'Please enter your name');
        return;
      }
      
      localStorage.setItem('userName', name);
      localStorage.setItem('userAvatar', selectedAvatar);
      
      alert(currentLang === 'zh' ? '已儲存!' : 'Saved!');
      location.href = 'student-dashboard-full.html';
    }
  </script>
</body>
</html>
