<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Edit Profile - EduPilot</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans SC', Roboto, sans-serif;
      background: #f0f9ff;
      min-height: 100vh;
      padding-bottom: 80px;
    }

    /* Header */
    .header {
      position: sticky;
      top: 0;
      background: linear-gradient(135deg, #3b82f6, #1d4ed8);
      color: white;
      z-index: 50;
    }

    .header-content {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 14px 16px;
      max-width: 600px;
      margin: 0 auto;
    }

    .back-btn {
      background: none;
      border: none;
      color: white;
      font-size: 26px;
      cursor: pointer;
    }

    .header h1 {
      font-size: 20px;
      font-weight: 800;
    }

    /* Main Content */
    .main {
      padding: 16px;
      max-width: 600px;
      margin: 0 auto;
    }

    /* Profile Card */
    .profile-card {
      background: white;
      border-radius: 20px;
      padding: 24px;
      text-align: center;
      margin-bottom: 20px;
      border: 2px solid #f1f5f9;
    }

    .avatar-large {
      width: 80px;
      height: 80px;
      border-radius: 50%;
      background: linear-gradient(135deg, #3b82f6, #1d4ed8);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 40px;
      margin: 0 auto 16px;
    }

    .profile-name {
      font-size: 22px;
      font-weight: 800;
      color: #1e293b;
      margin-bottom: 4px;
    }

    .profile-email {
      font-size: 14px;
      color: #64748b;
    }

    /* Form */
    .form-section {
      background: white;
      border-radius: 16px;
      padding: 20px;
      margin-bottom: 16px;
      border: 2px solid #f1f5f9;
    }

    .section-title {
      font-size: 14px;
      font-weight: 700;
      color: #1e293b;
      margin-bottom: 16px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .form-group {
      margin-bottom: 16px;
    }

    .form-group:last-child {
      margin-bottom: 0;
    }

    .form-label {
      display: block;
      font-size: 13px;
      font-weight: 600;
      color: #475569;
      margin-bottom: 6px;
    }

    .form-input {
      width: 100%;
      padding: 12px 14px;
      border: 2px solid #e2e8f0;
      border-radius: 12px;
      font-size: 15px;
      outline: none;
    }

    .form-input:focus {
      border-color: #3b82f6;
    }

    .form-select {
      width: 100%;
      padding: 12px 14px;
      border: 2px solid #e2e8f0;
      border-radius: 12px;
      font-size: 15px;
      background: white;
      outline: none;
    }

    /* Language Toggle */
    .lang-options {
      display: flex;
      gap: 10px;
    }

    .lang-btn {
      flex: 1;
      padding: 12px;
      border: 2px solid #e2e8f0;
      border-radius: 12px;
      background: white;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      text-align: center;
    }

    .lang-btn.active {
      background: linear-gradient(135deg, #3b82f6, #1d4ed8);
      color: white;
      border-color: transparent;
    }

    /* Buttons */
    .btn-group {
      display: flex;
      gap: 12px;
      margin-top: 20px;
    }

    .btn {
      flex: 1;
      padding: 14px;
      border-radius: 12px;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      border: none;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    .btn-primary {
      background: linear-gradient(135deg, #3b82f6, #1d4ed8);
      color: white;
    }

    .btn-danger {
      background: white;
      color: #ef4444;
      border: 2px solid #ef4444;
    }

    .btn-save {
      background: linear-gradient(135deg, #22c55e, #16a34a);
      color: white;
    }

    /* Info Box */
    .info-box {
      background: #f8fafc;
      border-radius: 12px;
      padding: 14px;
      margin-bottom: 16px;
    }

    .info-row {
      display: flex;
      justify-content: space-between;
      padding: 8px 0;
      border-bottom: 1px solid #e2e8f0;
    }

    .info-row:last-child {
      border-bottom: none;
    }

    .info-label {
      font-size: 14px;
      color: #64748b;
    }

    .info-value {
      font-size: 14px;
      font-weight: 600;
      color: #1e293b;
    }

    /* Bottom Nav */
    .bottom-nav {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      background: white;
      border-top: 2px solid #e2e8f0;
      z-index: 50;
      padding-bottom: env(safe-area-inset-bottom);
    }

    .nav-content {
      display: flex;
      justify-content: space-around;
      padding: 6px 0 8px;
      max-width: 600px;
      margin: 0 auto;
    }

    .nav-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 2px;
      padding: 4px 10px;
      background: none;
      border: none;
      color: #94a3b8;
      cursor: pointer;
      min-width: 70px;
    }

    .nav-item.active { color: #3b82f6; }
    .nav-item .icon { font-size: 22px; }
    .nav-item .label { font-size: 10px; font-weight: 600; }

    /* Toast */
    .toast {
      position: fixed;
      bottom: 100px;
      left: 50%;
      transform: translateX(-50%);
      background: #1e293b;
      color: white;
      padding: 14px 24px;
      border-radius: 12px;
      font-size: 14px;
      font-weight: 600;
      z-index: 200;
      display: none;
    }

    .toast.show {
      display: block;
      animation: fadeInOut 2s ease-in-out;
    }

    @keyframes fadeInOut {
      0%, 100% { opacity: 0; transform: translateX(-50%) translateY(20px); }
      20%, 80% { opacity: 1; transform: translateX(-50%) translateY(0); }
    }
  </style>
</head>
<body>
  <!-- Header -->
  <header class="header">
    <div class="header-content">
      <button class="back-btn" onclick="location.href='student-dashboard-full.html'">←</button>
      <h1 id="pageTitle">👤 Edit Profile</h1>
    </div>
  </header>

  <!-- Main Content -->
  <main class="main">
    <!-- Profile Card -->
    <div class="profile-card">
      <div class="avatar-large">👦</div>
      <div class="profile-name" id="displayName">Tommy Tsang</div>
      <div class="profile-email">tommy@lsi.edu</div>
    </div>

    <!-- Account Info -->
    <div class="form-section">
      <div class="section-title" id="sectionInfo">📋 Account Information</div>
      
      <div class="info-box">
        <div class="info-row">
          <span class="info-label" id="labelLevel">Level</span>
          <span class="info-value">⭐ 9</span>
        </div>
        <div class="info-row">
          <span class="info-label" id="labelPoints">Points</span>
          <span class="info-value">2,050</span>
        </div>
        <div class="info-row">
          <span class="info-label" id="labelClass">Class</span>
          <span class="info-value">P4 - Class A</span>
        </div>
        <div class="info-row">
          <span class="info-label" id="labelSchool">School</span>
          <span class="info-value">LSI Learning Academy</span>
        </div>
      </div>
    </div>

    <!-- Edit Profile -->
    <div class="form-section">
      <div class="section-title" id="sectionEdit">✏️ Edit Profile</div>
      
      <div class="form-group">
        <label class="form-label" id="labelName">Display Name</label>
        <input type="text" class="form-input" id="inputName" value="Tommy Tsang">
      </div>

      <div class="form-group">
        <label class="form-label" id="labelAvatar">Avatar</label>
        <div style="display: flex; gap: 10px;">
          <button class="lang-btn active" onclick="selectAvatar(this, '👦')">👦</button>
          <button class="lang-btn" onclick="selectAvatar(this, '👧')">👧</button>
          <button class="lang-btn" onclick="selectAvatar(this, '🧒')">🧒</button>
          <button class="lang-btn" onclick="selectAvatar(this, '👦🏻')">👦🏻</button>
          <button class="lang-btn" onclick="selectAvatar(this, '👧🏻')">👧🏻</button>
        </div>
      </div>
    </div>

    <!-- Language Settings -->
    <div class="form-section">
      <div class="section-title" id="sectionLang">🌐 Language / 語言</div>
      
      <div class="lang-options">
        <button class="lang-btn active" id="btnEnglish" onclick="setLanguage('en')">
          🇺🇸 English
        </button>
        <button class="lang-btn" id="btnChinese" onclick="setLanguage('zh')">
          🇭🇰 繁體中文
        </button>
      </div>
    </div>

    <!-- Notification Settings -->
    <div class="form-section">
      <div class="section-title" id="sectionNotif">🔔 Notifications</div>
      
      <div class="form-group">
        <label class="form-label" id="labelEmailNotif">Email Notifications</label>
        <select class="form-select" id="emailNotif">
          <option value="all" id="optAll">All notifications</option>
          <option value="important" id="optImportant">Important only</option>
          <option value="none" id="optNone">None</option>
        </select>
      </div>
    </div>

    <!-- Save Button -->
    <div class="btn-group">
      <button class="btn btn-save" onclick="saveProfile()">
        <span>💾</span>
        <span id="btnSave">Save Changes</span>
      </button>
    </div>

    <!-- Logout -->
    <div class="btn-group">
      <button class="btn btn-danger" onclick="logout()">
        <span>🚪</span>
        <span id="btnLogout">Logout</span>
      </button>
    </div>
  </main>

  <!-- Toast -->
  <div class="toast" id="toast">✅ Saved successfully!</div>

  <!-- Bottom Navigation -->
  <nav class="bottom-nav">
    <div class="nav-content">
      <button class="nav-item" onclick="location.href='student-dashboard-full.html'">
        <span class="icon">🏠</span>
        <span class="label" id="navHome">Home</span>
      </button>
      <button class="nav-item" onclick="location.href='subjects-all.html'">
        <span class="icon">📚</span>
        <span class="label" id="navLearn">Learn</span>
      </button>
      <button class="nav-item" onclick="location.href='leaderboard-full.html'">
        <span class="icon">🏆</span>
        <span class="label" id="navRanks">Ranks</span>
      </button>
      <button class="nav-item active" onclick="location.href='student-dashboard-full.html'">
        <span class="icon">☰</span>
        <span class="label" id="navMenu">Menu</span>
      </button>
    </div>
  </nav>

  <script>
    let currentLang = 'en';
    let currentAvatar = '👦';

    const translations = {
      en: {
        title: '👤 Edit Profile',
        sectionInfo: '📋 Account Information',
        sectionEdit: '✏️ Edit Profile',
        sectionLang: '🌐 Language',
        sectionNotif: '🔔 Notifications',
        labelLevel: 'Level',
        labelPoints: 'Points',
        labelClass: 'Class',
        labelSchool: 'School',
        labelName: 'Display Name',
        labelAvatar: 'Avatar',
        labelEmailNotif: 'Email Notifications',
        optAll: 'All notifications',
        optImportant: 'Important only',
        optNone: 'None',
        btnSave: 'Save Changes',
        btnLogout: 'Logout',
        navHome: 'Home',
        navLearn: 'Learn',
        navRanks: 'Ranks',
        navMenu: 'Menu',
        saved: '✅ Saved successfully!',
        confirmLogout: 'Are you sure you want to logout?'
      },
      zh: {
        title: '👤 編輯個人資料',
        sectionInfo: '📋 帳戶資料',
        sectionEdit: '✏️ 編輯資料',
        sectionLang: '🌐 語言',
        sectionNotif: '🔔 通知設定',
        labelLevel: '等級',
        labelPoints: '積分',
        labelClass: '班級',
        labelSchool: '學校',
        labelName: '顯示名稱',
        labelAvatar: '頭像',
        labelEmailNotif: '電郵通知',
        optAll: '所有通知',
        optImportant: '只限重要通知',
        optNone: '關閉',
        btnSave: '儲存變更',
        btnLogout: '登出',
        navHome: '主頁',
        navLearn: '學習',
        navRanks: '排名',
        navMenu: '選單',
        saved: '✅ 儲存成功！',
        confirmLogout: '確定要登出嗎？'
      }
    };

    function setLanguage(lang) {
      currentLang = lang;
      
      // Update buttons
      document.getElementById('btnEnglish').classList.toggle('active', lang === 'en');
      document.getElementById('btnChinese').classList.toggle('active', lang === 'zh');
      
      // Update all text
      const t = translations[lang];
      document.getElementById('pageTitle').textContent = t.title;
      document.getElementById('sectionInfo').textContent = t.sectionInfo;
      document.getElementById('sectionEdit').textContent = t.sectionEdit;
      document.getElementById('sectionLang').textContent = t.sectionLang;
      document.getElementById('sectionNotif').textContent = t.sectionNotif;
      document.getElementById('labelLevel').textContent = t.labelLevel;
      document.getElementById('labelPoints').textContent = t.labelPoints;
      document.getElementById('labelClass').textContent = t.labelClass;
      document.getElementById('labelSchool').textContent = t.labelSchool;
      document.getElementById('labelName').textContent = t.labelName;
      document.getElementById('labelAvatar').textContent = t.labelAvatar;
      document.getElementById('labelEmailNotif').textContent = t.labelEmailNotif;
      document.getElementById('optAll').textContent = t.optAll;
      document.getElementById('optImportant').textContent = t.optImportant;
      document.getElementById('optNone').textContent = t.optNone;
      document.getElementById('btnSave').textContent = t.btnSave;
      document.getElementById('btnLogout').textContent = t.btnLogout;
      document.getElementById('navHome').textContent = t.navHome;
      document.getElementById('navLearn').textContent = t.navLearn;
      document.getElementById('navRanks').textContent = t.navRanks;
      document.getElementById('navMenu').textContent = t.navMenu;
      
      // Save preference
      localStorage.setItem('language', lang);
    }

    function selectAvatar(btn, avatar) {
      currentAvatar = avatar;
      document.querySelectorAll('.form-group .lang-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      document.querySelector('.avatar-large').textContent = avatar;
    }

    function saveProfile() {
      const name = document.getElementById('inputName').value;
      localStorage.setItem('userName', name);
      localStorage.setItem('userAvatar', currentAvatar);
      localStorage.setItem('language', currentLang);
      
      // Update display
      document.getElementById('displayName').textContent = name;
      
      // Show toast
      const t = translations[currentLang];
      document.getElementById('toast').textContent = t.saved;
      document.getElementById('toast').classList.add('show');
      setTimeout(() => {
        document.getElementById('toast').classList.remove('show');
      }, 2000);
    }

    function logout() {
      const t = translations[currentLang];
      if (confirm(t.confirmLogout)) {
        location.href = 'index.html';
      }
    }

    // Load saved preferences
    document.addEventListener('DOMContentLoaded', () => {
      const savedLang = localStorage.getItem('language') || 'en';
      setLanguage(savedLang);
      
      const savedName = localStorage.getItem('userName');
      if (savedName) {
        document.getElementById('inputName').value = savedName;
        document.getElementById('displayName').textContent = savedName;
      }
      
      const savedAvatar = localStorage.getItem('userAvatar');
      if (savedAvatar) {
        currentAvatar = savedAvatar;
        document.querySelector('.avatar-large').textContent = savedAvatar;
      }
    });
  </script>
</body>
</html>
