<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Join Class - EduPilot</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans SC', Roboto, sans-serif;
      background: #f0f9ff;
      min-height: 100vh;
      padding-bottom: 80px;
      -webkit-font-smoothing: antialiased;
    }

    /* Header */
    .header {
      position: sticky;
      top: 0;
      background: linear-gradient(135deg, #3b82f6, #1d4ed8);
      color: white;
      z-index: 100;
    }

    .header-content {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 14px 16px;
    }

    .header-left {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .back-btn {
      background: rgba(255,255,255,0.2);
      border: none;
      width: 40px;
      height: 40px;
      border-radius: 12px;
      font-size: 22px;
      cursor: pointer;
      color: white;
    }

    .header-title {
      font-size: 18px;
      font-weight: 800;
    }

    /* Language Toggle */
    .lang-toggle {
      display: flex;
      background: rgba(255,255,255,0.2);
      border-radius: 12px;
      overflow: hidden;
    }

    .lang-btn {
      padding: 8px 12px;
      background: none;
      border: none;
      color: rgba(255,255,255,0.7);
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
    }

    .lang-btn.active {
      background: rgba(255,255,255,0.3);
      color: white;
    }

    /* Main Content */
    .main {
      padding: 20px 16px;
      max-width: 600px;
      margin: 0 auto;
    }

    /* Hero */
    .hero {
      text-align: center;
      padding: 24px 16px;
      margin-bottom: 20px;
    }

    .hero-icon {
      font-size: 56px;
      margin-bottom: 12px;
    }

    .hero-title {
      font-size: 22px;
      font-weight: 800;
      color: #1e293b;
      margin-bottom: 6px;
    }

    .hero-subtitle {
      font-size: 14px;
      color: #64748b;
    }

    /* Code Input Card */
    .code-card {
      background: white;
      border-radius: 20px;
      padding: 24px;
      border: 2px solid #f1f5f9;
      margin-bottom: 20px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.05);
    }

    .code-input {
      width: 100%;
      padding: 18px;
      border: 3px solid #e2e8f0;
      border-radius: 16px;
      font-size: 28px;
      font-weight: 800;
      text-align: center;
      text-transform: uppercase;
      letter-spacing: 8px;
      color: #1e293b;
      margin-bottom: 16px;
    }

    .code-input:focus {
      outline: none;
      border-color: #3b82f6;
    }

    .code-input::placeholder {
      font-size: 16px;
      font-weight: 600;
      color: #94a3b8;
      letter-spacing: 2px;
    }

    .join-btn {
      width: 100%;
      padding: 16px;
      background: linear-gradient(135deg, #3b82f6, #1d4ed8);
      color: white;
      border: none;
      border-radius: 14px;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
    }

    .join-btn:disabled {
      background: #cbd5e1;
      cursor: not-allowed;
    }

    .hint-text {
      text-align: center;
      font-size: 13px;
      color: #64748b;
      margin-top: 12px;
    }

    /* Section */
    .section-title {
      font-size: 18px;
      font-weight: 800;
      color: #1e293b;
      margin-bottom: 12px;
    }

    /* Empty State */
    .empty-state {
      background: white;
      border-radius: 16px;
      padding: 32px 20px;
      border: 2px dashed #e2e8f0;
      text-align: center;
    }

    .empty-icon {
      font-size: 48px;
      margin-bottom: 12px;
    }

    .empty-title {
      font-size: 16px;
      font-weight: 700;
      color: #1e293b;
      margin-bottom: 4px;
    }

    .empty-text {
      font-size: 13px;
      color: #64748b;
    }

    /* Modal */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.6);
      z-index: 200;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .modal-overlay.active {
      display: flex;
    }

    .modal-content {
      background: white;
      border-radius: 24px;
      width: 100%;
      max-width: 360px;
      padding: 28px;
      text-align: center;
    }

    .modal-icon {
      font-size: 56px;
      margin-bottom: 12px;
    }

    .modal-title {
      font-size: 20px;
      font-weight: 800;
      color: #1e293b;
      margin-bottom: 6px;
    }

    .modal-text {
      font-size: 14px;
      color: #64748b;
      margin-bottom: 16px;
    }

    .modal-class-info {
      background: #f8fafc;
      border-radius: 12px;
      padding: 14px;
      margin-bottom: 16px;
    }

    .modal-class-name {
      font-size: 16px;
      font-weight: 700;
      color: #1e293b;
    }

    .modal-class-teacher {
      font-size: 13px;
      color: #64748b;
      margin-top: 4px;
    }

    .modal-btn {
      width: 100%;
      padding: 14px;
      background: linear-gradient(135deg, #3b82f6, #1d4ed8);
      color: white;
      border: none;
      border-radius: 12px;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
    }

    /* Bottom Nav */
    .bottom-nav {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      background: white;
      border-top: 2px solid #e2e8f0;
      z-index: 50;
      padding-bottom: env(safe-area-inset-bottom);
    }

    .nav-content {
      display: flex;
      justify-content: space-around;
      padding: 8px 0 12px;
    }

    .nav-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      padding: 8px 16px;
      background: none;
      border: none;
      color: #94a3b8;
      cursor: pointer;
    }

    .nav-item.active { color: #3b82f6; }
    .nav-item .icon { font-size: 28px; }
    .nav-item .label { font-size: 12px; font-weight: 700; }
  </style>
</head>
<body>
  <!-- Header -->
  <header class="header">
    <div class="header-content">
      <div class="header-left">
        <button class="back-btn" onclick="location.href='student-dashboard-full.html'">←</button>
        <span class="header-title" data-en="Join Class" data-zh="加入班級">Join Class</span>
      </div>
      <div class="lang-toggle">
        <button class="lang-btn active" onclick="setLang('en')">EN</button>
        <button class="lang-btn" onclick="setLang('zh')">中文</button>
      </div>
    </div>
  </header>

  <!-- Main Content -->
  <main class="main">
    <!-- Hero -->
    <div class="hero">
      <div class="hero-icon">🎒</div>
      <h2 class="hero-title" data-en="Join Your Class" data-zh="加入你的班級">Join Your Class</h2>
      <p class="hero-subtitle" data-en="Enter the class code from your teacher" data-zh="輸入老師提供的班級代碼">Enter the class code from your teacher</p>
    </div>

    <!-- Code Input -->
    <div class="code-card">
      <input type="text" 
             class="code-input" 
             id="classCode" 
             placeholder="ABC123" 
             maxlength="6"
             oninput="validateCode()">
      
      <button class="join-btn" id="joinBtn" disabled onclick="joinClass()">
        <span>✨</span>
        <span data-en="Join Class" data-zh="加入班級">Join Class</span>
      </button>
      
      <p class="hint-text" data-en="Ask your teacher for the 6-character code" data-zh="向老師索取 6 位班級代碼">Ask your teacher for the 6-character code</p>
    </div>

    <!-- My Classes -->
    <h3 class="section-title" data-en="My Classes" data-zh="我的班級">My Classes</h3>

    <div class="empty-state" id="emptyState">
      <div class="empty-icon">📭</div>
      <div class="empty-title" data-en="No Classes Yet" data-zh="還沒有班級">No Classes Yet</div>
      <div class="empty-text" data-en="Join a class above to get started" data-zh="在上面加入班級以開始">Join a class above to get started</div>
    </div>
  </main>

  <!-- Success Modal -->
  <div class="modal-overlay" id="successModal">
    <div class="modal-content">
      <div class="modal-icon">🎉</div>
      <h3 class="modal-title" data-en="Welcome!" data-zh="歡迎!">Welcome!</h3>
      <p class="modal-text" data-en="You've joined the class" data-zh="你已成功加入班級">You've joined the class</p>
      <div class="modal-class-info">
        <div class="modal-class-name" id="joinedClassName">Primary 4A</div>
        <div class="modal-class-teacher">👨‍🏫 Mr. Patrick</div>
      </div>
      <button class="modal-btn" data-en="Start Learning!" data-zh="開始學習!" onclick="closeModal()">Start Learning!</button>
    </div>
  </div>

  <!-- Bottom Navigation -->
  <nav class="bottom-nav">
    <div class="nav-content">
      <button class="nav-item" onclick="location.href='student-dashboard-full.html'">
        <span class="icon">🏠</span>
        <span class="label" data-en="Home" data-zh="主頁">Home</span>
      </button>
      <button class="nav-item" onclick="location.href='subjects-all.html'">
        <span class="icon">📚</span>
        <span class="label" data-en="Learn" data-zh="學習">Learn</span>
      </button>
      <button class="nav-item active">
        <span class="icon">🎒</span>
        <span class="label" data-en="Class" data-zh="班級">Class</span>
      </button>
      <button class="nav-item" onclick="location.href='settings.html'">
        <span class="icon" style="font-size: 24px;">👦</span>
        <span class="label" data-en="Me" data-zh="我">Me</span>
      </button>
    </div>
  </nav>

  <script>
    // Language
    let currentLang = 'en';

    function setLang(lang) {
      currentLang = lang;
      
      document.querySelectorAll('.lang-btn').forEach(b => b.classList.remove('active'));
      if (lang === 'en') {
        document.querySelector('.lang-btn:first-child').classList.add('active');
      } else {
        document.querySelector('.lang-btn:last-child').classList.add('active');
      }
      
      document.querySelectorAll('[data-en]').forEach(el => {
        el.textContent = el.getAttribute(`data-${lang}`);
      });
      
      localStorage.setItem('lang', lang);
    }

    const savedLang = localStorage.getItem('lang');
    if (savedLang) setLang(savedLang);

    // Code Validation
    function validateCode() {
      const code = document.getElementById('classCode').value.toUpperCase();
      const btn = document.getElementById('joinBtn');
      btn.disabled = code.length !== 6;
    }

    // Auto-uppercase
    document.getElementById('classCode').addEventListener('input', function(e) {
      this.value = this.value.toUpperCase();
    });

    // Join Class
    function joinClass() {
      const code = document.getElementById('classCode').value.toUpperCase();
      
      if (code.length === 6) {
        // TODO: Check against Supabase
        document.getElementById('successModal').classList.add('active');
      }
    }

    // Close Modal
    function closeModal() {
      document.getElementById('successModal').classList.remove('active');
      document.getElementById('classCode').value = '';
      document.getElementById('joinBtn').disabled = true;
      
      // Hide empty state, show class info
      document.getElementById('emptyState').innerHTML = `
        <div style="background: white; border-radius: 16px; padding: 16px; border: 2px solid #f1f5f9;">
          <div style="font-size: 16px; font-weight: 700; color: #1e293b; margin-bottom: 4px;">Primary 4A</div>
          <div style="font-size: 12px; color: #64748b;">👨‍🏫 Mr. Patrick • Just joined</div>
          <button onclick="location.href='student-dashboard-full.html'" style="width: 100%; margin-top: 12px; padding: 12px; background: linear-gradient(135deg, #22c55e, #16a34a); color: white; border: none; border-radius: 10px; font-weight: 700; cursor: pointer;">🚀 ${currentLang === 'zh' ? '進入班級' : 'Enter Class'}</button>
        </div>
      `;
    }
  </script>
</body>
</html>
